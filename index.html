<style>:root{--bg:#fff;--bg2:#EEF3FF;--tx:#0B1F4D;--mt:#3F4F7C;--bl:#1E5BFF;--pu:#7B5CFF;--bd:#D5DEF5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1230;--bg2:#141C42;--tx:#EAF0FF;--mt:#B4C0E6;--bl:#8FB0FF;--pu:#B9A6FF;--bd:#2A3566}}
:root[data-theme=dark]{--bg:#0B1230;--bg2:#141C42;--tx:#EAF0FF;--mt:#B4C0E6;--bl:#8FB0FF;--pu:#B9A6FF;--bd:#2A3566}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.8;font-size:16px}
html[lang=ja] [lang=en],html[lang=en] [lang=ja]{display:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:8px 20px;flex-wrap:wrap}
header img{width:44px;height:44px;border-radius:8px}nav{display:flex;gap:4px 14px;flex-wrap:wrap;flex:1;font-size:14px}nav a{color:var(--tx);text-decoration:none;padding:6px 2px}nav a:hover{color:var(--bl)}
button.lg{min-height:44px;min-width:64px;border:1px solid var(--bl);background:none;color:var(--bl);border-radius:22px;font:inherit;font-weight:700;cursor:pointer}
.hero{background:linear-gradient(135deg,#1E5BFF,#7B5CFF);color:#fff;text-align:center;padding:72px 20px}.hero img{width:min(260px,60vw);border-radius:18px}.hero h1{font-size:clamp(28px,6vw,48px);margin:20px 0 6px}.hero p{margin:4px auto;max-width:640px}
.btn{display:inline-block;margin:16px 6px 0;padding:12px 24px;border-radius:26px;background:#fff;color:#1E3FAF;font-weight:700;text-decoration:none}
section{max-width:1040px;margin:0 auto;padding:56px 20px}h2{font-size:28px;margin:0 0 4px;background:linear-gradient(90deg,var(--bl),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--mt);margin:0 0 20px;font-size:14px;letter-spacing:1px}
.gr{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.c{background:var(--bg2);border-radius:12px;padding:16px 18px}.c h3{margin:0 0 4px;font-size:16px;color:var(--bl)}.c p{margin:0;font-size:14px;color:var(--mt)}
.alt{background:var(--bg2)}.alt .c{background:var(--bg)}.org{display:flex;flex-direction:column;align-items:center;gap:10px}.org .r{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.org .n{background:linear-gradient(90deg,#1E5BFF,#7B5CFF);color:#fff;border-radius:10px;padding:10px 18px;font-weight:700;text-align:center}.org .n.s{background:var(--bg2);color:var(--tx);font-weight:400;font-size:14px}
footer{background:#0B1F4D;color:#fff;text-align:center;padding:36px 20px;font-size:14px}footer a{color:#C9D8FF}.note{font-size:13px;color:var(--mt)}
